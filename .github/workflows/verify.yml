name: Verify release

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_DB: fixture
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fixture -d fixture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Build and install
        run: |
          python -m pip install -r requirements.lock
          python -m build --no-isolation
          python -m pip install "scholars-attendant-core[geometry] @ file://$(realpath dist/*.whl)"
          python -m pip check
          python evals/run_memory_demo.py
      - name: Test with PostgreSQL and SQLite
        env:
          PG_FIXTURE: ${{ job.services.postgres.id }}
          RA_TEST_POSTGRES_URL: postgresql+psycopg://fixture:synthetic-fixture@127.0.0.1:${{ job.services.postgres.ports[5432] }}/fixture
        run: |
          docker exec "$PG_FIXTURE" psql -v ON_ERROR_STOP=1 -U fixture -d fixture -c 'CREATE EXTENSION vector;'
          python -m pytest -q

  openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
